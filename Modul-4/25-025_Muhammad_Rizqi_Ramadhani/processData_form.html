<!DOCTYPE html>
<html>
<head>
	<title>Form Input Data</title>
	<style>
		body{background-color: dodgerblue;}
		.field {display: flex;}
  		label {width: 160px; text-align: right;
  		margin-right: 20px}
	</style>
</head>
<body>
	<fieldset style="font-family: arial; background-color: white;">
		<h1>Register</h1>
		<fieldset style="background-color: lavender;">
			<legend style="font-weight: bold;">Person Details</legend>
				<form name="myForm" action="processData.php" method="POST">
					<div class="field">
						<label for="surname">Surname</label>
						<input type="text" name="surname" size="31">
					</div>
					<div class="field">
						<label for="email">Email address</label>
						<input type="text" name="email" size="31">
					</div>
					<div class="field">
						<label for="password">Password</label>
						<input type="text" name="password" size="31">
					</div>
					<div class="field">
						<label for="address">Street address</label>
						<textarea name="address" rows="3" cols="22"></textarea>
					</div>
					<div class="field">
						<label for="state">State</label>
						<select name="state">
							<option value="-1" selected>[choose your state]</option>
							<option value="1">Australian Capital Territory</option>
							<option value="2">Queensland</option>
							<option value="3">Victoria</option>
							<option value="4">New South Wales</option>
							<option value="5">Tasmania</option>
							<option value="6">South Australia</option>
							<option value="7">Werten Australian</option>
							<option value="8">Nothern Territory</option>
						</select>
					</div>
					<div class="field">
						<input type="hidden" name="country" value="Australia">
					</div>
					<div class="field">
						<label for="sex">Gender</label>
						<input type="radio" name="sex" value="male"/>Male
						<input type="radio" name="sex" value="female"/>Female
					</div>
					<div class="field">
						<label for="vegetarian">Vegetarian?</label>
						<input type="checkbox" name="vegetarian" />
					</div>
					<div class="field">
						<label>&nbsp;</label>
						<input type="submit" value="submit" name="submit" /><input type="reset" value="reset" name="reset" />
					</div>
				</form>
	</fieldset>
</body>
</html>
